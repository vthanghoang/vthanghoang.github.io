<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FPGA AES SoC architecture</title>
  <desc id="desc">A block diagram showing a host interface, AXI or UART bridge, AES accelerator, key expansion, memory and FPGA board.</desc>
  <defs>
    <style>
      .bg{fill:#f6f4ee}.box{fill:#fffdf8;stroke:#24364b;stroke-width:3;rx:18}.core{fill:#d9eef3;stroke:#0f6f83;stroke-width:4;rx:18}.accent{fill:#f2c7b8;stroke:#b85d45;stroke-width:3;rx:18}.mem{fill:#e7e6c9;stroke:#657145;stroke-width:3;rx:18}.t{font-family:Arial,sans-serif;fill:#24364b}.h{font-size:29px;font-weight:700}.s{font-size:22px}.sm{font-size:18px}.wire{stroke:#24364b;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#b85d45;stroke-width:3;fill:none;stroke-dasharray:10 8}.label{font-size:17px;fill:#b85d45;font-family:Arial,sans-serif;font-weight:700}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#24364b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="t h" x="600" y="52" text-anchor="middle">FPGA AES SoC architecture</text>
  <text class="t sm" x="600" y="82" text-anchor="middle">128-bit data path with programmable control and hardware acceleration</text>
  <rect class="box" x="45" y="170" width="220" height="120"/>
  <text class="t h" x="155" y="218" text-anchor="middle">Host / UART</text><text class="t s" x="155" y="255" text-anchor="middle">plaintext + key</text>
  <rect class="box" x="325" y="150" width="230" height="160"/>
  <text class="t h" x="440" y="202" text-anchor="middle">SoC control</text><text class="t s" x="440" y="240" text-anchor="middle">registers • FSM</text><text class="t s" x="440" y="275" text-anchor="middle">status / ready</text>
  <rect class="core" x="625" y="125" width="270" height="210"/>
  <text class="t h" x="760" y="177" text-anchor="middle">AES accelerator</text><text class="t s" x="760" y="218" text-anchor="middle">AddRoundKey</text><text class="t s" x="760" y="250" text-anchor="middle">SubBytes • ShiftRows</text><text class="t s" x="760" y="282" text-anchor="middle">MixColumns • rounds</text>
  <rect class="accent" x="945" y="155" width="210" height="130"/>
  <text class="t h" x="1050" y="205" text-anchor="middle">Ciphertext</text><text class="t s" x="1050" y="245" text-anchor="middle">128-bit output</text>
  <path class="wire" d="M265 230 H325"/><path class="wire" d="M555 230 H625"/><path class="wire" d="M895 230 H945"/>
  <text class="label" x="292" y="215" text-anchor="middle">control</text><text class="label" x="590" y="215" text-anchor="middle">data + key</text>
  <rect class="mem" x="305" y="430" width="245" height="130"/>
  <text class="t h" x="427" y="480" text-anchor="middle">Round-key RAM</text><text class="t s" x="427" y="520" text-anchor="middle">expanded words</text>
  <rect class="box" x="625" y="430" width="270" height="130"/>
  <text class="t h" x="760" y="480" text-anchor="middle">Key expansion</text><text class="t s" x="760" y="520" text-anchor="middle">RotWord • SubWord • Rcon</text>
  <rect class="box" x="945" y="430" width="210" height="130"/>
  <text class="t h" x="1050" y="480" text-anchor="middle">FPGA board</text><text class="t s" x="1050" y="520" text-anchor="middle">Vivado / Zynq</text>
  <path class="wire" d="M760 335 V430"/><path class="wire" d="M625 495 H550"/><path class="wire" d="M895 495 H945"/>
  <path class="dash" d="M440 310 V390 H760 V430"/><text class="label" x="605" y="382" text-anchor="middle">round-key request</text>
  <text class="t sm" x="600" y="625" text-anchor="middle">Simulation verifies each transform before bitstream programming and hardware demonstration.</text>
</svg>
